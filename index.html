<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pemantauan Kebugaran Fisik Atlet</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:20px;
}

table{
    border-collapse: collapse;
    width:100%;
}

th,td{
    border:1px solid #ccc;
    padding:8px;
    text-align:center;
}

th{
    background:#f2f2f2;
}

input[type="number"]{
    width:80px;
}

button{
    padding:10px 20px;
    cursor:pointer;
}

h2{
    margin-bottom:20px;
}
</style>

</head>
<body>

<h2>PEMANTAUAN KEBUGARAN FISIK ATLIT</h2>

<label>Periode:</label>
<input type="month" id="periode">

<br><br>

<table id="assessmentTable">
    <thead>
        <tr>
            <th>Nama Atlet</th>
            <th>VO2 Max</th>
            <th>Strength</th>
            <th>Agility</th>
            <th>Speed</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<br>

<button id="saveBtn">
    Simpan Semua
</button>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxwmPE98LExxhDgxW-4d9Du_4YTORadfVetYzbcp5mAMLrL8zTDx4BE6sDj05FNI4-Q/exec";

const athletes = [
  { nama: "Rizky Ramadhan", gender: "Laki-laki", umur: 20 },
  { nama: "Alya Sabrina Putri", gender: "Perempuan", umur: 22 },
  { nama: "Siti Nurhaliza Kusuma", gender: "Perempuan", umur: 19 },
  { nama: "Daffa Arya Putra", gender: "Laki-laki", umur: 24 },
  { nama: "Amanda Citra Dewi", gender: "Perempuan", umur: 25 },
  { nama: "Farel Prayoga", gender: "Laki-laki", umur: 18 },
  { nama: "Nabila Syakieb Putri", gender: "Perempuan", umur: 21 },
  { nama: "Bintang Ramadhan", gender: "Laki-laki", umur: 23 },
  { nama: "Keysha Aurelia", gender: "Perempuan", umur: 19 },
  { nama: "Arif Rahman Hakim", gender: "Laki-laki", umur: 25 },
  { nama: "Tiara Andini", gender: "Perempuan", umur: 22 },
  { nama: "Gavin Mahardika", gender: "Laki-laki", umur: 20 },
  { nama: "Syifa Hadju Lestari", gender: "Perempuan", umur: 24 },
  { nama: "Aditya Prasetyo", gender: "Laki-laki", umur: 18 },
  { nama: "Chelsea Olivia Wijaya", gender: "Perempuan", umur: 23 }
];

const tbody =
document.querySelector("#assessmentTable tbody");

athletes.forEach((athlete) => {

    const row = document.createElement("tr");

    row.innerHTML = `
        <td class="nama">${athlete.nama}</td>

        <td>
            <input
                type="number"
                class="vo2"
                min="0"
                max="100">
        </td>

        <td>
            <input
                type="number"
                class="strength"
                min="0"
                max="100">
        </td>

        <td>
            <input
                type="number"
                class="agility"
                min="0"
                max="100">
        </td>

        <td>
            <input
                type="number"
                class="speed"
                step="0.01">
        </td>
    `;

    tbody.appendChild(row);
});

document
.getElementById("saveBtn")
.addEventListener("click", async () => {

    const periode =
    document.getElementById("periode").value;

    if (!periode) {
        alert("Silakan pilih periode terlebih dahulu.");
        return;
    }

    try {

        const rows =
        document.querySelectorAll(
            "#assessmentTable tbody tr"
        );

        for(let i = 0; i < rows.length; i++){

            const row = rows[i];
            const athlete = athletes[i];

            const payload = {

                tanggal: new Date()
                    .toLocaleDateString("id-ID"),

                periode: periode,

                nama_atlet: athlete.nama,

                jenis_kelamin:
                    athlete.gender,

                umur:
                    athlete.umur,

                vo2max:
                    row.querySelector(".vo2").value,

                strength:
                    row.querySelector(".strength").value,

                agility:
                    row.querySelector(".agility").value,

                speed:
                    row.querySelector(".speed").value
            };

            await fetch(API_URL,{
                method:"POST",
                body:JSON.stringify(payload)
            });
        }

        alert("Data berhasil disimpan ke Google Sheet");

    } catch(error){

        console.error(error);

        alert("Terjadi kesalahan saat menyimpan data");
    }

});

</script>

</body>
</html>
