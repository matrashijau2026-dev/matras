<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pemantauan Kebugaran Fisik Atlet</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f5f7f5;
    padding-bottom:30px;
}

.header{
    background:linear-gradient(135deg,#198754,#146c43);
    color:white;
    padding:25px;
    border-radius:0 0 25px 25px;
    text-align:center;
    position: relative;
}

.logout-btn {
    position: absolute;
    right: 20px;
    top: 25px;
}

.main-card, .login-card{
    margin-top:15px;
    border:none;
    border-radius:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.profile-box{
    background:#d1e7dd;
    padding:15px;
    border-radius:15px;
}

.form-control,
.form-select{
    min-height:50px;
    border-radius:12px;
}

.save-btn, .login-btn{
    height:55px;
    font-size:18px;
    font-weight:bold;
    border-radius:15px;
}

.label{
    font-weight:600;
    margin-bottom:5px;
}

.history-card{
    border:none;
    border-radius:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.table{
    margin-bottom:0;
}
</style>

</head>
<body>

<div id="loginPage" class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 90vh;">
        <div class="col-md-5">
            <div class="card login-card p-4">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-success">MASUK SISTEM</h3>
                    <small class="text-muted">Monitoring Kondisi Fisik Atlet</small>
                </div>
                
                <div class="mb-3">
                    <label class="label">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Masukkan username">
                </div>
                
                <div class="mb-4">
                    <label class="label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Masukkan password">
                </div>
                
                <button id="loginBtn" class="btn btn-success w-100 login-btn">LOGIN</button>
                
                <div id="loginErrorMsg" class="alert alert-danger mt-3 d-none"></div>
            </div>
        </div>
    </div>
</div>

<div id="mainContent" class="d-none">

    <div class="header">
        <h3 class="mb-1">
            PEMANTAUAN KEBUGARAN FISIK ATLET
        </h3>
        <small>
            Sistem Monitoring Kondisi Atlet
        </small>
        <button id="logoutBtn" class="btn btn-sm btn-outline-light logout-btn">Logout</button>
    </div>

    <div class="container">

        <div class="card main-card">
            <div class="card-body">

                <div class="mb-3">
                    <label class="label">Periode</label>
                    <input type="month" id="periode" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="label">Pilih Atlet</label>
                    <select id="athleteSelect" class="form-select"></select>
                </div>

                <div class="profile-box mb-4">
                    <h5 id="namaAtlet"></h5>

                    <div>
                        <strong>Jenis Kelamin:</strong>
                        <span id="gender"></span>
                    </div>

                    <div>
                        <strong>Umur:</strong>
                        <span id="umur"></span>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="label">VO2 Max</label>
                    <input type="number" id="vo2" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="label">Strength</label>
                    <input type="number" id="strength" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="label">Agility (Detik)</label>
                    <input type="number" step="0.01" id="agility" class="form-control">
                </div>

                <div class="mb-4">
                    <label class="label">Speed (Detik)</label>
                    <input type="number" step="0.01" id="speed" class="form-control">
                </div>

                <button id="saveBtn" class="btn btn-success w-100 save-btn">
                    SIMPAN PENILAIAN
                </button>

                <div id="successMsg" class="alert alert-success mt-3 d-none"></div>

            </div>
        </div>

        <div class="card history-card mt-4">
            <div class="card-body">
                <h5 class="mb-3">Riwayat Penilaian</h5>
                <div id="historyContainer">Belum ada data.</div>
            </div>
        </div>

    </div>

</div>

<script>

// URL API TERBARU MILIK ANDA
const API_URL = "https://script.google.com/macros/s/AKfycby5MTN24ycvad5InIEy3UHHmqUKE9QXhFVj8R80hot2RiTNC8-aqqM2bZuq6vWw2ayZ/exec";

let athletes = []; 
const select = document.getElementById("athleteSelect");

// Proses Validasi Login melalui Google Apps Script
document.getElementById("loginBtn").addEventListener("click", async () => {
    const userInp = document.getElementById("username").value;
    const passInp = document.getElementById("password").value;
    const errorMsg = document.getElementById("loginErrorMsg");
    const loginBtn = document.getElementById("loginBtn");

    if (!userInp || !passInp) {
        alert("Username dan password wajib diisi!");
        return;
    }

    loginBtn.disabled = true;
    loginBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>MEMVERIFIKASI...`;
    errorMsg.classList.add("d-none");

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({
                action: "login",
                username: userInp,
                password: passInp
            })
        });

        const result = await response.json();

        if (result.success) {
            athletes = result.athletes;
            
            renderAthleteDropdown();
            
            document.getElementById("loginPage").classList.add("d-none");
            document.getElementById("mainContent").classList.remove("d-none");
            
            initApp();
        } else {
            errorMsg.textContent = result.message || "Username atau password salah!";
            errorMsg.classList.remove("d-none");
        }
    } catch (error) {
        console.error(error);
        alert("Gagal terhubung ke Google Spreadsheet server.");
    } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = "LOGIN";
    }
});

// Aksi Keluar Sistem (Logout)
document.getElementById("logoutBtn").addEventListener("click", () => {
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
    document.getElementById("mainContent").classList.add("d-none");
    document.getElementById("loginPage").classList.remove("d-none");
    select.innerHTML = "";
    athletes = [];
});

function renderAthleteDropdown() {
    select.innerHTML = ""; 
    athletes.forEach((athlete, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = athlete.nama;
        select.appendChild(option);
    });
}

function loadAthlete(index){
    if(athletes.length === 0) return;
    const athlete = athletes[index];
    document.getElementById("namaAtlet").textContent = athlete.nama;
    document.getElementById("gender").textContent = athlete.gender;
    document.getElementById("umur").textContent = athlete.umur + " Tahun";
}

async function loadHistory(athleteName){
    try{
        const response = await fetch(API_URL + "?athlete=" + encodeURIComponent(athleteName));
        const data = await response.json();
        const container = document.getElementById("historyContainer");

        if(!Array.isArray(data) || data.length === 0){
            container.innerHTML = "<p>Belum ada data.</p>";
            return;
        }

        let html = `
        <div class="table-responsive">
        <table class="table table-bordered table-sm">
        <thead>
        <tr>
            <th>Periode</th>
            <th>VO2</th>
            <th>Strength</th>
            <th>Agility</th>
            <th>Speed</th>
        </tr>
        </thead>
        <tbody>
        `;

        data.forEach(item => {
            html += `
            <tr>
                <td>${item.periode}</td>
                <td>${item.vo2max} (${item.kategori_vo2})</td>
                <td>${item.strength} (${item.kategori_strength})</td>
                <td>${item.agility} (${item.kategori_agility})</td>
                <td>${item.speed} (${item.kategori_speed})</td>
            </tr>
            `;
        });

        html += `
        </tbody>
        </table>
        </div>
        `;

        container.innerHTML = html;

    }catch(error){
        console.error(error);
        document.getElementById("historyContainer").innerHTML = "<p>Gagal memuat riwayat.</p>";
    }
}

function initApp() {
    if(athletes.length > 0) {
        loadAthlete(0);
        loadHistory(athletes[0].nama);
    }
}

select.addEventListener("change",(e)=>{
    loadAthlete(e.target.value);
    loadHistory(athletes[e.target.value].nama);
});

document.getElementById("saveBtn").addEventListener("click", async () => {
    const periode = document.getElementById("periode").value;
    const vo2 = document.getElementById("vo2").value;
    const strength = document.getElementById("strength").value;
    const agility = document.getElementById("agility").value;
    const speed = document.getElementById("speed").value;

    if(!periode || !vo2 || !strength || !agility || !speed){
        alert("Semua data harus diisi");
        return;
    }

    const athlete = athletes[select.value];
    const payload = {
        tanggal: new Date().toLocaleDateString("id-ID"),
        periode: periode,
        nama_atlet: athlete.nama,
        jenis_kelamin: athlete.gender,
        umur: athlete.umur,
        vo2max: vo2,
        strength: strength,
        agility: agility,
        speed: speed
    };

    const btn = document.getElementById("saveBtn");
    const successMsg = document.getElementById("successMsg");

    if(btn.disabled){ return; }
    btn.disabled = true;

    btn.innerHTML = `
        <span class="spinner-border spinner-border-sm me-2"></span>
        MENYIMPAN...
    `;

    try{
        const response = await fetch(API_URL,{
            method:"POST",
            body:JSON.stringify(payload)
        });

        const result = await response.json();
        successMsg.classList.remove("d-none");

        if(result.action === "updated"){
            successMsg.className = "alert alert-warning mt-3";
            successMsg.textContent = "Data periode ini berhasil diperbarui";
        }else{
            successMsg.className = "alert alert-success mt-3";
            successMsg.textContent = "Data berhasil disimpan";
        }

        loadHistory(athlete.nama);

        document.getElementById("vo2").value="";
        document.getElementById("strength").value="";
        document.getElementById("agility").value="";
        document.getElementById("speed").value="";

        setTimeout(()=>{
            successMsg.className = "alert alert-success mt-3 d-none";
        },4000);

    }catch(error){
        console.error(error);
        successMsg.className = "alert alert-danger mt-3";
        successMsg.textContent = "Gagal menyimpan data";
        successMsg.classList.remove("d-none");
    }finally{
        btn.disabled = false;
        btn.innerHTML = "SIMPAN PENILAIAN";
    }
});

</script>

</body>
</html>
