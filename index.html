<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pemantauan Kebugaran Fisik Atlet</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

:root{
    --green-primary:#198754;
    --green-dark:#146c43;
    --green-light:#d1e7dd;
}

body{
    background:#f4f7f5;
    font-family:Arial, sans-serif;
}

.header{
    background:linear-gradient(135deg,var(--green-primary),var(--green-dark));
    color:white;
    padding:30px 20px;
    border-radius:0 0 25px 25px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.main-card{
    margin-top:-20px;
    border-radius:20px;
    border:none;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.profile-box{
    background:var(--green-light);
    border-radius:15px;
    padding:15px;
}

.form-control,
.form-select{
    border-radius:12px;
    min-height:50px;
}

.score-input{
    text-align:center;
    font-size:18px;
    font-weight:bold;
}

.save-btn{
    height:55px;
    border-radius:15px;
    font-size:18px;
    font-weight:bold;
}

.label-title{
    font-weight:600;
    margin-bottom:5px;
}

.badge-athlete{
    font-size:14px;
}

.footer-space{
    height:20px;
}

</style>
</head>
<body>

<div class="header text-center">
    <h3 class="mb-1">
        PEMANTAUAN KEBUGARAN FISIK ATLIT
    </h3>

    <small>
        Sistem Monitoring Kondisi Atlet
    </small>
</div>

<div class="container">

    <div class="card main-card">
        <div class="card-body">

            <div class="mb-3">
                <label class="label-title">
                    Periode Penilaian
                </label>

                <input
                    type="month"
                    id="periode"
                    class="form-control">
            </div>

            <div class="mb-3">
                <label class="label-title">
                    Pilih Atlet
                </label>

                <select
                    id="athleteSelect"
                    class="form-select">
                </select>
            </div>

            <div class="profile-box mb-4">

                <h5 id="namaAtlet" class="mb-3"></h5>

                <div class="d-flex gap-2 flex-wrap">

                    <span
                        class="badge text-bg-success badge-athlete"
                        id="gender">
                    </span>

                    <span
                        class="badge text-bg-secondary badge-athlete"
                        id="umur">
                    </span>

                </div>

            </div>

            <div class="mb-3">
                <label class="label-title">
                    VO2 Max
                </label>

                <input
                    type="number"
                    id="vo2"
                    class="form-control score-input"
                    placeholder="Masukkan nilai">
            </div>

            <div class="mb-3">
                <label class="label-title">
                    Strength
                </label>

                <input
                    type="number"
                    id="strength"
                    class="form-control score-input"
                    placeholder="Masukkan nilai">
            </div>

            <div class="mb-3">
                <label class="label-title">
                    Agility
                </label>

                <input
                    type="number"
                    id="agility"
                    class="form-control score-input"
                    placeholder="Masukkan nilai">
            </div>

            <div class="mb-4">
                <label class="label-title">
                    Speed (Detik)
                </label>

                <input
                    type="number"
                    step="0.01"
                    id="speed"
                    class="form-control score-input"
                    placeholder="Contoh: 3.95">
            </div>

            <button
                id="saveBtn"
                class="btn btn-success w-100 save-btn">

                SIMPAN PENILAIAN

            </button>

        </div>
    </div>

    <div class="footer-space"></div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxwmPE98LExxhDgxW-4d9Du_4YTORadfVetYzbcp5mAMLrL8zTDx4BE6sDj05FNI4-Q/exec";

const athletes = [

  { nama: "Rizky Ramadhan", gender: "Laki-laki", umur: 20 },
  { nama: "Alya Sabrina Putri", gender: "Perempuan", umur: 22 },
  { nama: "Siti Nurhaliza Kusuma", gender: "Perempuan", umur: 19 },
  { nama: "Daffa Arya Putra", gender: "Laki-laki", umur: 24 },
  { nama: "Amanda Citra Dewi", gender: "Perempuan", umur: 25 },
  { nama: "Farel Prayoga", gender: "Laki-laki", umur: 18 },
  { nama: "Nabila Syakieb Putri", gender: "Perempuan", umur: 21 },
  { nama: "Bintang Ramadhan", gender: "Laki-laki", umur: 23 },
  { nama: "Keysha Aurelia", gender: "Perempuan", umur: 19 },
  { nama: "Arif Rahman Hakim", gender: "Laki-laki", umur: 25 },
  { nama: "Tiara Andini", gender: "Perempuan", umur: 22 },
  { nama: "Gavin Mahardika", gender: "Laki-laki", umur: 20 },
  { nama: "Syifa Hadju Lestari", gender: "Perempuan", umur: 24 },
  { nama: "Aditya Prasetyo", gender: "Laki-laki", umur: 18 },
  { nama: "Chelsea Olivia Wijaya", gender: "Perempuan", umur: 23 }

];

const select =
document.getElementById("athleteSelect");

athletes.forEach((athlete,index)=>{

    const option =
    document.createElement("option");

    option.value = index;
    option.textContent = athlete.nama;

    select.appendChild(option);

});

function loadAthlete(index){

    const athlete = athletes[index];

    document.getElementById("namaAtlet")
    .textContent = athlete.nama;

    document.getElementById("gender")
    .textContent = athlete.gender;

    document.getElementById("umur")
    .textContent = athlete.umur + " Tahun";

}

loadAthlete(0);

select.addEventListener("change",(e)=>{

    loadAthlete(e.target.value);

});

document
.getElementById("saveBtn")
.addEventListener("click", async ()=>{

    const periode =
    document.getElementById("periode").value;

    if(!periode){
        alert("Pilih periode terlebih dahulu");
        return;
    }

    const athlete =
    athletes[select.value];

    const payload = {

        tanggal:
        new Date().toLocaleDateString("id-ID"),

        periode:

        periode,

        nama_atlet:
        athlete.nama,

        jenis_kelamin:
        athlete.gender,

        umur:
        athlete.umur,

        vo2max:
        document.getElementById("vo2").value,

        strength:
        document.getElementById("strength").value,

        agility:
        document.getElementById("agility").value,

        speed:
        document.getElementById("speed").value
    };

    try{

        await fetch(API_URL,{
            method:"POST",
            body:JSON.stringify(payload)
        });

        alert("Penilaian berhasil disimpan");

        document.getElementById("vo2").value="";
        document.getElementById("strength").value="";
        document.getElementById("agility").value="";
        document.getElementById("speed").value="";

    }catch(error){

        console.error(error);

        alert("Gagal menyimpan data");
    }

});

</script>

</body>
</html>
