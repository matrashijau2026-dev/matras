<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pemantauan Kebugaran Fisik Atlet</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f5f7f5;
    padding-bottom:30px;
}

/* 📱 OPTIMALISASI HALAMAN LOGIN (MOBILE FRIENDLY) */
#loginPage {
    background: linear-gradient(rgba(20, 108, 67, 0.85), rgba(25, 135, 84, 0.9)), url('logo_bolmong.png') no-repeat center center fixed;
    background-size: cover;
    min-height: 100vh;
}

.login-card {
    border: none;
    border-radius: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(5px);
}

.login-logo {
    max-width: 100px;
    height: auto;
    margin-bottom: 15px;
    filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.15));
}

/* 📱 OPTIMALISASI HEADER HALAMAN UTAMA */
.header{
    background: linear-gradient(135deg,#198754,#146c43);
    color: white;
    padding: 20px 15px;
    border-radius: 0 0 25px 25px;
}

.header-logo {
    max-height: 65px; /* Sedikit dikecilkan agar pas di baris mobile jika dipaksakan muncul */
    width: auto;
    filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.2));
}

/* 📱 UKURAN INPUT BESAR (Sangat Nyaman untuk Jempol di HP) */
.form-control,
.form-select{
    min-height: 50px;
    border-radius: 12px;
    font-size: 16px; /* Mencegah iOS/Safari melakukan auto-zoom otomatis saat input diklik */
}

.save-btn, .login-btn{
    height: 55px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 15px;
}

.main-card, .history-card{
    margin-top: 15px;
    border: none;
    border-radius: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,.04);
}

.profile-box{
    background: #d1e7dd;
    padding: 15px;
    border-radius: 15px;
}

.label{
    font-weight: 600;
    margin-bottom: 5px;
}

.table{
    margin-bottom: 0;
}

.logout-container {
    margin-top: 35px;
    margin-bottom: 20px;
}
</style>

</head>
<body>

<div id="loginPage" class="container-fluid d-flex align-items-center justify-content-center">
    <div class="row justify-content-center w-100 mx-0">
        <div class="col-12 col-sm-8 col-md-5 col-lg-4 px-0">
            <div class="card login-card p-4">
                <div class="text-center mb-4">
                    <img src="logo_bolmong.png" alt="Logo Bolaang Mongondow Utara" class="login-logo">
                    <h3 class="fw-bold text-success mb-1">LOGIN</h3>
                    <div class="text-muted small fw-semibold">Monitoring Kondisi Fisik Atlet</div>
                    <div class="text-muted small">Kab. Bolaang Mongondow Utara</div>
                </div>
                
                <div class="mb-3">
                    <label class="label">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Masukkan username">
                </div>
                
                <div class="mb-4">
                    <label class="label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Masukkan password">
                </div>
                
                <button id="loginBtn" class="btn btn-success w-100 login-btn">LOGIN</button>
                
                <div id="loginErrorMsg" class="alert alert-danger mt-3 d-none"></div>
            </div>
        </div>
    </div>
</div>

<div id="mainContent" class="d-none">

    <div class="header">
        <div class="container d-flex align-items-center justify-content-between px-1">
            <img src="logo_sulut.png" alt="Logo Bolmong Utara" class="header-logo d-inline-block">
            
            <div class="text-center flex-grow-1 mx-2">
                <h3 class="mb-1 fw-bold" style="font-size: calc(1.0rem + 0.5vw); line-height: 1.2;">
                    PEMANTAUAN KEBUGARAN FISIK ATLET
                </h3>
                <h4 class="mb-2 fw-semibold" style="font-size: calc(0.85rem + 0.3vw); opacity: 0.95;">
                    KAB. BOLAANG MONGONDOW UTARA
                </h4> 
                <span class="badge bg-white bg-opacity-25 px-2.5 py-1.5 rounded-pill text-white fw-normal" style="font-size: 11px;">
                    Sistem Monitoring Kondisi Atlet
                </span>
            </div>
            
            <img src="logo_bolmong.png" alt="Logo Sulawesi Utara" class="header-logo d-inline-block">
        </div>
    </div>

    <div class="container px-3">

        <div class="card main-card">
            <div class="card-body p-3 p-sm-4">

                <div class="mb-3">
                    <label class="label">Periode</label>
                    <input type="month" id="periode" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="label">Pilih Atlet</label>
                    <select id="athleteSelect" class="form-select"></select>
                </div>

                <div class="profile-box mb-4">
                    <h5 id="namaAtlet" class="fw-bold text-success mb-2"></h5>

                    <div class="small">
                        <strong>Jenis Kelamin:</strong>
                        <span id="gender"></span>
                    </div>

                    <div class="small">
                        <strong>Umur:</strong>
                        <span id="umur"></span>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="label">VO2 Max</label>
                    <input type="number" id="vo2" class="form-control" inputmode="numeric">
                </div>

                <div class="mb-3">
                    <label class="label">Strength</label>
                    <input type="number" id="strength" class="form-control" inputmode="numeric">
                </div>

                <div class="mb-3">
                    <label class="label">Agility (Detik)</label>
                    <input type="number" step="0.01" id="agility" class="form-control" inputmode="decimal">
                </div>

                <div class="mb-4">
                    <label class="label">Speed (Detik)</label>
                    <input type="number" step="0.01" id="speed" class="form-control" inputmode="decimal">
                </div>

                <button id="saveBtn" class="btn btn-success w-100 save-btn">
                    SIMPAN PENILAIAN
                </button>

                <div id="successMsg" class="alert alert-success mt-3 d-none"></div>

            </div>
        </div>

        <div class="card history-card mt-4">
            <div class="card-body p-3">
                <h5 class="mb-3 fw-bold text-success">Riwayat Penilaian</h5>
                <div id="historyContainer">Belum ada data.</div>
            </div>
        </div>

        <div class="text-center logout-container">
            <button id="logoutBtn" class="btn btn-danger w-100 py-3 rounded-4 fw-bold shadow-sm" style="max-width: 300px;">
                Keluar dari Sistem (Logout)
            </button>
        </div>

    </div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycby5MTN24ycvad5InIEy3UHHmqUKE9QXhFVj8R80hot2RiTNC8-aqqM2bZuq6vWw2ayZ/exec";

let athletes = []; 
const select = document.getElementById("athleteSelect");

// Login handler
document.getElementById("loginBtn").addEventListener("click", async () => {
    const userInp = document.getElementById("username").value;
    const passInp = document.getElementById("password").value;
    const errorMsg = document.getElementById("loginErrorMsg");
    const loginBtn = document.getElementById("loginBtn");

    if (!userInp || !passInp) {
        alert("Username dan password wajib diisi!");
        return;
    }

    loginBtn.disabled = true;
    loginBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>MEMVERIFIKASI...`;
    errorMsg.classList.add("d-none");

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({
                action: "login",
                username: userInp,
                password: passInp
            })
        });

        const result = await response.json();

        if (result.success) {
            athletes = result.athletes;
            renderAthleteDropdown();
            
            document.getElementById("loginPage").classList.add("d-none");
            document.getElementById("mainContent").classList.remove("d-none");
            
            initApp();
        } else {
            errorMsg.textContent = result.message || "Username atau password salah!";
            errorMsg.classList.remove("d-none");
        }
    } catch (error) {
        console.error(error);
        alert("Gagal terhubung ke Google Spreadsheet server.");
    } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = "LOGIN";
    }
});

// Perbaikan Eror Fungsi Logout
document.getElementById("logoutBtn").addEventListener("click", () => {
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
    document.getElementById("mainContent").classList.add("d-none");
    
    // Memperbaiki properti class login page agar muncul penuh kembali
    const loginPage = document.getElementById("loginPage");
    loginPage.className = "container-fluid d-flex align-items-center justify-content-center";
    
    select.innerHTML = "";
    athletes = [];
    window.scrollTo(0, 0); 
});

function renderAthleteDropdown() {
    select.innerHTML = ""; 
    athletes.forEach((athlete, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = athlete.nama;
        select.appendChild(option);
    });
}

function loadAthlete(index){
    if(athletes.length === 0) return;
    const athlete = athletes[index];
    document.getElementById("namaAtlet").textContent = athlete.nama;
    document.getElementById("gender").textContent = athlete.gender;
    document.getElementById("umur").textContent = athlete.umur + " Tahun";
}

async function loadHistory(athleteName){
    try{
        const response = await fetch(API_URL + "?athlete=" + encodeURIComponent(athleteName));
        const data = await response.json();
        const container = document.getElementById("historyContainer");

        if(!Array.isArray(data) || data.length === 0){
            container.innerHTML = "<p class='text-muted small'>Belum ada data.</p>";
            return;
        }

        let html = `
        <div class="table-responsive">
        <table class="table table-bordered table-striped table-sm small">
        <thead class="table-dark">
        <tr>
            <th>Periode</th>
            <th>VO2</th>
            <th>Strength</th>
            <th>Agility</th>
            <th>Speed</th>
        </tr>
        </thead>
        <tbody>
        `;

        data.forEach(item => {
            html += `
            <tr>
                <td><strong>${item.periode}</strong></td>
                <td>${item.vo2max}<br><small class="text-muted">${item.kategori_vo2}</small></td>
                <td>${item.strength}<br><small class="text-muted">${item.kategori_strength}</small></td>
                <td>${item.agility}s<br><small class="text-muted">${item.kategori_agility}</small></td>
                <td>${item.speed}s<br><small class="text-muted">${item.kategori_speed}</small></td>
            </tr>
            `;
        });

        html += `
        </tbody>
        </table>
        </div>
        `;

        container.innerHTML = html;

    }catch(error){
        console.error(error);
        document.getElementById("historyContainer").innerHTML = "<p class='text-danger small'>Gagal memuat riwayat.</p>";
    }
}

function initApp() {
    if(athletes.length > 0) {
        loadAthlete(0);
        loadHistory(athletes[0].nama);
    }
}

select.addEventListener("change",(e)=>{
    loadAthlete(e.target.value);
    loadHistory(athletes[e.target.value].nama);
});

document.getElementById("saveBtn").addEventListener("click", async () => {
    const periode = document.getElementById("periode").value;
    const vo2 = document.getElementById("vo2").value;
    const strength = document.getElementById("strength").value;
    const agility = document.getElementById("agility").value;
    const speed = document.getElementById("speed").value;

    if(!periode || !vo2 || !strength || !agility || !speed){
        alert("Semua data harus diisi");
        return;
    }

    const athlete = athletes[select.value];
    const payload = {
        tanggal: new Date().toLocaleDateString("id-ID"),
        periode: periode,
        nama_atlet: athlete.nama,
        jenis_kelamin: athlete.gender,
        umur: athlete.umur,
        vo2max: vo2,
        strength: strength,
        agility: agility,
        speed: speed
    };

    const btn = document.getElementById("saveBtn");
    const successMsg = document.getElementById("successMsg");

    if(btn.disabled){ return; }
    btn.disabled = true;

    btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>MENYIMPAN...`;

    try{
        const response = await fetch(API_URL,{
            method:"POST",
            body:JSON.stringify(payload)
        });

        const result = await response.json();
        successMsg.classList.remove("d-none");

        if(result.action === "updated"){
            successMsg.className = "alert alert-warning mt-3 small";
            successMsg.textContent = "Data periode ini berhasil diperbarui";
        }else{
            successMsg.className = "alert alert-success mt-3 small";
            successMsg.textContent = "Data berhasil disimpan";
        }

        loadHistory(athlete.nama);

        document.getElementById("vo2").value="";
        document.getElementById("strength").value="";
        document.getElementById("agility").value="";
        document.getElementById("speed").value="";

        setTimeout(()=>{
            successMsg.className = "alert alert-success mt-3 d-none";
        },4000);

    }catch(error){
        console.error(error);
        successMsg.className = "alert alert-danger mt-3 small";
        successMsg.textContent = "Gagal menyimpan data";
        successMsg.classList.remove("d-none");
    }finally{
        btn.disabled = false;
        btn.innerHTML = "SIMPAN PENILAIAN";
    }
});

</script>

</body>
</html>
