<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Penilaian Atlet</title>
</head>
<body>

<h2>PEMANTAUAN KEBUGARAN FISIK ATLIT</h2>

<label>Periode:</label>
<input type="month" id="periode">

<br><br>

<table border="1" id="assessmentTable">

    <thead>
        <tr>
            <th>Nama Atlet</th>
            <th>VO2 Max</th>
            <th>Strength</th>
            <th>Agility</th>
            <th>Speed</th>
        </tr>
    </thead>

    <tbody></tbody>

</table>

<br>

<button id="saveBtn">
    Simpan Semua
</button>

<script> const API_URL =

const athletes = [
  { nama: "Rizky Ramadhan", gender: "Laki-laki", umur: 20 },
  { nama: "Alya Sabrina Putri", gender: "Perempuan", umur: 22 },
  { nama: "Siti Nurhaliza Kusuma", gender: "Perempuan", umur: 19 },
  { nama: "Daffa Arya Putra", gender: "Laki-laki", umur: 24 },

  { nama: "Bintang Ramadhan", gender: "Laki-laki", umur: 23 },

  { nama: "Aditya Prasetyo", gender: "Laki-laki", umur: 18 },
  { nama: "Chelsea Olivia Wijaya", gender: "Perempuan", umur: 23 }
];

const tbody =
document.querySelector("#assessmentTable tbody");

athletes.forEach((athlete) => {

    const row = document.createElement("tr");

    row.innerHTML = `
        <td>${athlete.nama}</td>

        <td>
            <input type="number"
                   class="vo2"
                   min="0"
                   max="100">
        </td>

            <input type="number"
                   class="strength"
                   min="0"
                   max="100">
        </td>

            <input type="number"
                   class="agility"
                   min="0"
                   max="100">
        </td>

        <td>
            <input type="number"
                   class="speed"
                   step="0.01">
        </td>
    `;

    tbody.appendChild(row);

}); </script>
    
</body>
</html>
